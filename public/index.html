<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f33;--navy-2:#13304d;--teal:#0f766e;--teal-2:#14b8a6;--gold:#d4a24c;--gold-2:#f3d08a;
  --bg:#f5f7fa;--card:#fff;--text:#0f1b2a;--muted:#5b6b7c;--line:#e4e9f0;--danger:#dc2626;--ok:#15803d;
  --r:18px;--shadow:0 1px 2px rgba(15,27,42,.06),0 8px 24px rgba(15,27,42,.07);--shadow-h:0 2px 4px rgba(15,27,42,.08),0 18px 40px rgba(15,27,42,.12);
  --font:'Cairo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
body[dir=ltr]{font-family:'Inter','Cairo',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.hidden{display:none!important}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;color:var(--navy);letter-spacing:-.3px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--teal));display:grid;place-items:center;color:var(--gold-2);font-size:18px}
.brand em{font-style:normal;color:var(--teal)}
.links{display:flex;gap:26px;margin-inline-start:auto}
.links a{font-weight:600;font-size:15px;color:var(--muted);position:relative;padding:4px 0;transition:color .2s}
.links a:hover{color:var(--navy)}
.links a::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.links a:hover::after{transform:scaleX(1)}
.actions{display:flex;gap:10px;align-items:center}
.lang{position:relative}
.lang select{appearance:none;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;outline:none}
.lang select:focus{border-color:var(--teal)}
.who{font-size:14px;font-weight:700;color:var(--navy);background:var(--bg);padding:6px 12px;border-radius:999px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;padding:11px 22px;border-radius:12px;font-weight:700;font-size:15px;transition:all .2s;white-space:nowrap}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:#0c5f58}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e8b65f);color:var(--navy)}
.btn-gold:hover{filter:brightness(1.05);box-shadow:0 8px 20px rgba(212,162,76,.35)}
.btn-line{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-line:hover{border-color:var(--navy)}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}

/* ---------- Hero ---------- */
.hero{position:relative;background:radial-gradient(1200px 500px at 85% -10%,rgba(20,184,166,.35),transparent 60%),radial-gradient(900px 400px at -10% 110%,rgba(212,162,76,.25),transparent 60%),linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:90px 0 150px;text-align:center;overflow:hidden}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--gold-2);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.hero h1{font-size:50px;font-weight:800;line-height:1.2;max-width:820px;margin:0 auto 16px;letter-spacing:-.5px}
.hero p{font-size:18px;opacity:.85;max-width:620px;margin:0 auto}
.search{position:relative;z-index:2;margin:-80px auto 0;max-width:980px;background:#fff;border-radius:22px;box-shadow:var(--shadow-h);padding:14px;display:grid;grid-template-columns:1.1fr 1.2fr 1fr 1fr auto;gap:10px;align-items:end}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 4px;letter-spacing:.2px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--teal)}

/* ---------- Sections ---------- */
section.block{padding:80px 0}
section.alt{background:#fff}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head h2{font-size:30px;font-weight:800;letter-spacing:-.3px;color:var(--navy)}
.head p{color:var(--muted);margin-top:4px}
.filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.filters select{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:210px;outline:none}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.cover{height:140px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;background:linear-gradient(135deg,#e6f4f3,#fbf1de)}
.cover .tag{position:absolute;top:12px;inset-inline-start:12px;font-size:11px;font-weight:700;background:#fff;color:var(--navy);padding:4px 10px;border-radius:999px;box-shadow:var(--shadow)}
.cover .tag.demo{color:#92400e;background:#fef3c7}
.body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ttl{font-size:18px;font-weight:800;color:var(--navy);line-height:1.3}
.sub{font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eef6f5;color:var(--teal)}
.chip.gold{background:#fbf3e2;color:#8a5a14}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.rate{font-weight:800;color:#b7791f;font-size:14px}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:20px;font-weight:800;color:var(--navy)}
.price small{font-size:12px;color:var(--muted);font-weight:600}
.btns{display:flex;gap:6px}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

/* ---------- Why ---------- */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why div{background:var(--bg);border-radius:var(--r);padding:26px 22px}
.why b{display:block;font-size:17px;color:var(--navy);margin:10px 0 4px}
.why span{color:var(--muted);font-size:14px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--navy);color:var(--gold-2);font-size:20px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,31,51,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:22px;width:100%;max-width:580px;max-height:92vh;overflow:auto;position:relative;padding:30px;box-shadow:var(--shadow-h)}
.modal h3{font-size:24px;font-weight:800;color:var(--navy)}
.modal .lead{color:var(--muted);font-size:14px;margin-top:2px}
.x{position:absolute;top:16px;inset-inline-end:16px;width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;font-size:16px}
.x:hover{background:var(--line)}
.hero-ico{height:150px;display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:16px;background:linear-gradient(135deg,#e6f4f3,#fbf1de);margin-bottom:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.kv div{background:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.kv small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.offer{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.offer h5{font-size:15px;font-weight:800;color:var(--navy)}
.offer p{font-size:13.5px;color:var(--muted);margin-top:4px}
.fm{display:grid;gap:14px;margin-top:18px}
.fm label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fm input:not([type=checkbox]):not([type=radio]),.fm select,.fm textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--teal)}
.fm textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.3px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-top:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles label{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-weight:800;color:var(--muted);transition:.2s;display:block;margin:0}
.roles label i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.roles input:checked+label{border-color:var(--teal);background:#eef6f5;color:var(--navy)}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.langs label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;margin:0}
.langs input{accent-color:var(--teal)}
.langs label:has(input:checked){border-color:var(--teal);background:#eef6f5}
.note{font-size:12.5px;color:var(--muted);background:#fbf7ef;border:1px solid #f3e4c3;border-radius:12px;padding:10px 12px}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;margin-top:16px}
.total b{font-size:20px;color:var(--gold-2)}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.switch a{color:var(--teal);font-weight:800;cursor:pointer}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:4px}

/* ---------- Toast & footer ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,140px);background:var(--navy);color:#fff;padding:14px 24px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-h);transition:transform .35s;z-index:200;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
footer{background:var(--navy);color:#b9c7d6;padding:56px 0 28px;margin-top:40px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px}
footer h4{color:#fff;font-size:16px;margin-bottom:12px}
footer p,footer li{font-size:14px;list-style:none;margin-bottom:6px}
.copy{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;opacity:.7}

@media(max-width:1000px){
  .search{grid-template-columns:1fr 1fr}
  .links{display:none}
  .why{grid-template-columns:1fr 1fr}
  .hero h1{font-size:36px}
}
@media(max-width:560px){
  .search,.two,.kv,.roles{grid-template-columns:1fr}
  .langs{grid-template-columns:1fr 1fr}
  .why{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .who{display:none}
  .hero{padding:60px 0 130px}
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#" class="brand"><span class="brand-mark">✈</span><span>Tour<em>Ease</em></span></a>
    <nav class="links">
      <a href="#guides" data-i18n="nav_guides"></a>
      <a href="#offers" data-i18n="nav_offers"></a>
      <a href="#hotels" data-i18n="nav_hotels"></a>
      <a href="#tickets" data-i18n="nav_tickets"></a>
      <a href="#cars" data-i18n="nav_cars"></a>
    </nav>
    <div class="actions">
      <div class="lang">
        <select id="langSel" aria-label="Language">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </div>
      <span class="who" id="who"></span>
      <button class="btn btn-line btn-sm" id="btnLogin" data-i18n="login"></button>
      <button class="btn btn-navy btn-sm" id="btnRegister" data-i18n="register"></button>
      <button class="btn btn-gold btn-sm hidden" id="btnAdmin" data-i18n="admin_btn"></button>
      <button class="btn btn-line btn-sm hidden" id="btnLogout" data-i18n="logout"></button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <h1 data-i18n="hero_t"></h1>
    <p data-i18n="hero_s"></p>
  </div>
</div>

<div class="wrap">
  <div class="search">
    <div class="field"><label data-i18n="f_country"></label><select id="hCountry"></select></div>
    <div class="field"><label data-i18n="f_city"></label><input id="hCity" data-i18n-ph="f_city_ph"></div>
    <div class="field"><label data-i18n="f_date"></label><input type="date" id="hDate"></div>
    <div class="field"><label data-i18n="f_type"></label>
      <select id="hType">
        <option value="guides" data-i18n="t_guide"></option>
        <option value="offers" data-i18n="t_offer"></option>
        <option value="hotels" data-i18n="t_hotel"></option>
        <option value="tickets" data-i18n="t_ticket"></option>
        <option value="cars" data-i18n="t_car"></option>
      </select>
    </div>
    <button class="btn btn-teal" id="hSearch" data-i18n="search"></button>
  </div>
</div>

<section class="block" id="guides">
  <div class="wrap">
    <div class="head">
      <div><h2 data-i18n="s_guides"></h2><p data-i18n="s_guides_d"></p></div>
      <button class="btn btn-gold btn-sm hidden" id="btnOffer" data-i18n="add_offer"></button>
    </div>
    <div class="filters">
      <select class="cSel" data-sec="guides"></select>
      <select id="gLang"></select>
    </div>
    <div class="grid" id="guidesGrid"></div>
  </div>
</section>

<section class="block alt" id="offers">
  <div class="wrap">
    <div class="head"><div><h2 data-i18n="s_offers"></h2><p data-i18n="s_offers_d"></p></div></div>
    <div class="filters"><select class="cSel" data-sec="offers"></select></div>
    <div class="grid" id="offersGrid"></div>
  </div>
</section>

<section class="block" id="hotels">
  <div class="wrap">
    <div class="head"><div><h2 data-i18n="s_hotels"></h2><p data-i18n="s_hotels_d"></p></div></div>
    <div class="filters"><select class="cSel" data-sec="hotels"></select></div>
    <div class="grid" id="hotelsGrid"></div>
  </div>
</section>

<section class="block alt" id="tickets">
  <div class="wrap">
    <div class="head"><div><h2 data-i18n="s_tickets"></h2><p data-i18n="s_tickets_d"></p></div></div>
    <div class="filters"><select class="cSel" data-sec="tickets"></select></div>
    <div class="grid" id="ticketsGrid"></div>
  </div>
</section>

<section class="block" id="cars">
  <div class="wrap">
    <div class="head"><div><h2 data-i18n="s_cars"></h2><p data-i18n="s_cars_d"></p></div></div>
    <div class="filters"><select class="cSel" data-sec="cars"></select></div>
    <div class="grid" id="carsGrid"></div>
  </div>
</section>

<section class="block alt">
  <div class="wrap">
    <div class="head"><div><h2 data-i18n="why_t"></h2><p data-i18n="why_s"></p></div></div>
    <div class="why">
      <div><span class="ico">✓</span><b data-i18n="w1_t"></b><span data-i18n="w1_s"></span></div>
      <div><span class="ico">＄</span><b data-i18n="w2_t"></b><span data-i18n="w2_s"></span></div>
      <div><span class="ico">⚡</span><b data-i18n="w3_t"></b><span data-i18n="w3_s"></span></div>
      <div><span class="ico">☎</span><b data-i18n="w4_t"></b><span data-i18n="w4_s"></span></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div><h4>TourEase</h4><p data-i18n="f_about"></p></div>
      <div><h4 data-i18n="f_links"></h4><ul><li data-i18n="nav_guides"></li><li data-i18n="nav_hotels"></li><li data-i18n="nav_tickets"></li><li data-i18n="nav_cars"></li></ul></div>
      <div><h4 data-i18n="f_contact"></h4><ul><li>support@tourease.com</li><li data-i18n="f_loc"></li></ul></div>
    </div>
    <div class="copy">© 2026 TourEase. <span data-i18n="f_rights"></span></div>
  </div>
</footer>

<!-- Auth -->
<div class="overlay" id="ovAuth">
  <div class="modal">
    <button class="x" data-close>✕</button>
    <div id="pReg">
      <h3 data-i18n="reg_h"></h3>
      <p class="lead" data-i18n="reg_s"></p>
      <div class="fm">
        <div class="roles">
          <input type="radio" name="role" id="rT" value="tourist" checked>
          <label for="rT"><i>🧳</i><span data-i18n="r_tourist"></span></label>
          <input type="radio" name="role" id="rG" value="guide">
          <label for="rG"><i>🧭</i><span data-i18n="r_guide"></span></label>
        </div>

        <div class="two">
          <div><label data-i18n="full_name"></label><input id="rName"></div>
          <div><label data-i18n="email"></label><input id="rEmail" type="email"></div>
        </div>
        <div><label data-i18n="pass"></label><input id="rPass" type="password"><small class="sub" style="display:block;margin-top:4px" data-i18n="pass_hint"></small></div>

        <div>
          <label data-i18n="speak"></label>
          <div class="langs" id="rLangsT"></div>
        </div>

        <div id="gFields" class="hidden" style="display:grid;gap:14px">
          <div class="section-title" data-i18n="g_sec_profile"></div>
          <div class="two">
            <div><label data-i18n="g_country"></label><select id="rCountry"></select></div>
            <div><label data-i18n="g_city"></label><input id="rCity"></div>
          </div>
          <div class="two">
            <div><label data-i18n="g_price"></label><input id="rPrice" type="number" min="0"></div>
            <div><label data-i18n="g_langs"></label><div class="langs" id="rLangsG" style="grid-template-columns:1fr 1fr"></div></div>
          </div>
          <div><label data-i18n="bio"></label><textarea id="rBio"></textarea></div>
          <div class="section-title" data-i18n="g_sec_legal"></div>
          <div class="two">
            <div><label data-i18n="tax"></label><input id="rTax"></div>
            <div><label data-i18n="lic_no"></label><input id="rLic"></div>
          </div>
          <div><label data-i18n="lic_exp"></label><input id="rLicExp" type="date"></div>
          <div class="note" data-i18n="lic_note"></div>
        </div>

        <button class="btn btn-navy btn-block" id="doReg" data-i18n="create"></button>
        <div class="err" id="regErr"></div>
      </div>
      <div class="switch"><span data-i18n="have_acc"></span> <a data-goto="login" data-i18n="login_go"></a></div>
    </div>

    <div id="pLog" class="hidden">
      <h3 data-i18n="login_h"></h3>
      <div class="fm">
        <div><label data-i18n="email"></label><input id="lEmail" type="email"></div>
        <div><label data-i18n="pass"></label><input id="lPass" type="password"></div>
        <button class="btn btn-navy btn-block" id="doLog" data-i18n="signin"></button>
        <div class="err" id="logErr"></div>
      </div>
      <div class="switch"><span data-i18n="no_acc"></span> <a data-goto="register" data-i18n="create_short"></a></div>
    </div>
  </div>
</div>

<div class="overlay" id="ovDetail"><div class="modal" id="boxDetail"></div></div>
<div class="overlay" id="ovBook"><div class="modal" id="boxBook"></div></div>

<div class="overlay" id="ovOffer">
  <div class="modal">
    <button class="x" data-close>✕</button>
    <h3 data-i18n="offer_h"></h3>
    <p class="lead" data-i18n="offer_s"></p>
    <div class="fm">
      <div><label data-i18n="o_title"></label><input id="oTitle"></div>
